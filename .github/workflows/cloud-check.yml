name: Check daily data and recover in the cloud
on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: skills-cloud-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check storage, freshness and publication; recover once if needed
        run: node scripts/cloud-check.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
