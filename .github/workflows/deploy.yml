name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['README*', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: skills-publication
  cancel-in-progress: false
jobs:
  build:
    outputs:
      data-sha: ${{ steps.data-digest.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/validate-data.mjs
      - run: npm run build
      - name: Record published data checksum
        id: data-digest
        run: echo "sha=$(sha256sum dist/assets/data.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live data matches artifact
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.data-sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "https://xylopyrifer.github.io/github-skills-weekly/assets/data.json?verify=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/skills-live.json"; then
              ACTUAL_SHA=$(sha256sum "$RUNNER_TEMP/skills-live.json" | cut -d ' ' -f1)
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo 'Live data checksum matches the validated artifact.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Live data does not match the validated artifact.'
          exit 1
